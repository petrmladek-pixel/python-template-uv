[project]
name = "python_template_uv"
version = "0.1.0"
description = "Python project generated from the master template"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.28.0",
]

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "google-genai>=2.14.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_template_uv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = []

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
skip = ".git,.venv,build,dist,uv.lock"
count = true
quiet-level = 3

[tool.uv]
package = true
